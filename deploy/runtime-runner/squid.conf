http_port 3128
visible_hostname astrbot-runtime-package-proxy
pid_filename none
pinger_enable off
cache deny all
cache_mem 16 MB
maximum_object_size 256 MB
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl manager proto cache_object
acl approved_package_hosts dstdomain .pypi.org .pythonhosted.org

http_access allow manager localhost
http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow approved_package_hosts
http_access deny all

request_header_access Proxy-Authorization deny all
request_header_access Authorization deny all
forwarded_for delete
via off
