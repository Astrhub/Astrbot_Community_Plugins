      rel="preload"
      href="/font/lexend-v25-latin-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style id="site-config-boot-style">
      .site-config-loading #app .brand-name {
        visibility: hidden;
      }

      .auth-session-loading #app .auth-session-control {
        visibility: hidden;
      }

      .route-snapshot-mismatch #app {
        visibility: hidden;
      }
    </style>
    <script data-cfasync="false">
      (() => {
        const normalizePath = (value) => String(value || "/").replace(/\/+$/, "") || "/";
        const snapshotPath = document.documentElement.dataset.prerenderPath;
        if (snapshotPath && normalizePath(snapshotPath) !== normalizePath(location.pathname)) {
          document.documentElement.classList.add("route-snapshot-mismatch");
        }

        const readCache = (key, maxAge) => {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) return false;
            const cached = JSON.parse(raw);
            if (cached?.version !== 1 || !cached.value || !Number.isFinite(cached.savedAt)) {
              return false;
            }
            return !maxAge || Date.now() - cached.savedAt <= maxAge;
          } catch {
            return false;
          }
        };
        if (!readCache("astrhub_site_config_v1")) {
          document.documentElement.classList.add("site-config-loading");
        }
        if (!readCache("astrhub_user_preview_v1", 7 * 24 * 60 * 60 * 1000)) {
          document.documentElement.classList.add("auth-session-loading");
        }
      })();
    </script>
    <script id="website-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Astrhub 插件市场",
        "url": "https://plugins.eloina.cn/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://plugins.eloina.cn/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>

  </body>
