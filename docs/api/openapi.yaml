openapi: 3.0.3
info:
  title: AstrBot Community Plugins API
  version: 0.1.0
  description: >
    AstrBot 社区插件市场 FastAPI 契约概览。本文件是端点级摘要（路径、方法、鉴权、简述），


    **权威契约以 FastAPI 运行时自动生成为准**：部署后访问 `/openapi.json` 获取完整
    OpenAPI 文档（含请求体与响应 schema），或访问 `/docs/rest`（Vue API Reference）、
    `/docs`（Swagger UI）/ `/redoc` 交互式浏览。本摘要与代码可能存在滞后，以运行时输出为准。

    存储为 PostgreSQL（业务数据），Redis（登录会话）。前端 Vue SPA 与未来的 AstrBot
    WebUI 插件均消费此 API。
servers:
  - url: http://127.0.0.1:8787
    description: 本地 / 单服务部署
tags:
  - name: Public
    description: 公开端点（网站、插件源、公告、setup、健康检查）
  - name: AstrBot Source
    description: AstrBot 自定义插件源 feed
  - name: Auth
    description: 登录、OAuth、注销、会话
  - name: Me
    description: 当前用户资料、插件、个人 API Key、通知
  - name: Plugins
    description: 插件详情、元数据编辑、上架/下架、点赞、评论
  - name: Admin
    description: 管理员（admin）审核与社区管理
  - name: Core
    description: 核心管理员（core_admin）系统设置与用户/管理员管理
  - name: API Keys
    description: 全局与个人 API Key
  - name: Artifacts
    description: 插件包提交、版本历史与结构化自动审查结果
  - name: Reviews
    description: 管理员人工决策、发布重试与安全撤回
paths:
  /health:
    get:
      tags: [Public]
      summary: 健康检查
      description: 返回 setup 状态、PostgreSQL/Redis 是否已配置。
      responses:
        "200":
          description: ok
  /v1/site:
    get:
      tags: [Public]
      summary: 公开站点配置
      description: 站点名称、图标、认证开关与市场功能开关。
      responses:
        "200":
          description: 站点配置
  /v1/setup/status:
    get:
      tags: [Public]
      summary: setup 状态（公开）
      description: 仅首次设置前可用，返回脱敏状态。
      responses:
        "200":
          description: setup 状态
        "404":
          description: 已完成初始化，端点已关闭
  /v1/setup:
    post:
      tags: [Public]
      summary: 执行首次初始化
      description: >
        仅 setup_required 时可用。创建/确认 PostgreSQL 目标库、初始化 schema、验证 Redis、
        写入核心管理员；全部成功后写入 .env 并进程内切换到 PgRedis 存储。
      responses:
        "200":
          description: 初始化成功，运行时配置已保存，PG/Redis 存储已激活
        "400":
          description: PostgreSQL 或 Redis 初始化失败（不写入 .env）
        "404":
          description: 已完成初始化，端点已关闭
  /v1/announcements:
    get:
      tags: [Public]
      summary: 公告列表
      responses:
        "200":
          description: 公告数组
  /v1/plugins:
    get:
      tags: [Public]
      summary: 已上架插件列表
      description: 仅返回 status=listed 的插件，支持搜索/筛选/排序/分页。
      responses:
        "200":
          description: 插件列表
  /v1/plugins/{id}:
    get:
      tags: [Plugins]
      summary: 插件详情
      description: 含评论树、点赞状态。
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: 插件详情
        "404":
          description: 未找到
    patch:
      tags: [Plugins]
      summary: 编辑插件元数据
      description: 插件所有者或 admin 可编辑。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: 元数据已更新
        "403":
          description: 无编辑权限
        "404":
          description: 未找到
  /v1/plugins/submissions:
    get:
      tags: [Admin]
      summary: 待审核提交队列
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 提交队列
        "403":
          description: 需要 admin
    post:
      tags: [Plugins]
      summary: 提交新插件
      description: 进入审核队列；PLUGIN_AUTO_APPROVE_ENABLED 时直接上架。
      security:
        - cookieAuth: []
      responses:
        "201":
          description: 提交已创建
        "400":
          description: 校验失败（插件名/仓库 URL/分类/标签上限）
        "403":
          description: 市场提交已关闭或未登录
  /v1/plugins/{id}/request-list:
    post:
      tags: [Plugins]
      summary: 申请上架
      description: 插件所有者将 pending 插件提交审核。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: 已加入审核
        "403":
          description: 非所有者
  /v1/plugins/{id}/unlist:
    post:
      tags: [Plugins]
      summary: 自主下架
      description: 插件所有者下架自己的插件。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: 已下架
        "403":
          description: 非所有者
  /v1/plugins/{id}/refresh-github:
    post:
      tags: [Plugins]
      summary: 手动刷新 GitHub 元数据
      description: 插件所有者可带临时 token 触发刷新。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: 元数据已刷新
        "429":
          description: GitHub rate limit
  /v1/plugins/{id}/like:
    post:
      tags: [Plugins]
      summary: 点赞插件
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: 已点赞
        "403":
          description: 点赞功能已关闭
  /v1/plugins/{id}/unlike:
    post:
      tags: [Plugins]
      summary: 取消点赞插件
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: 已取消点赞
  /v1/plugins/{id}/comments:
    post:
      tags: [Plugins]
      summary: 添加评论
      description: 支持 parent_id 嵌套回复。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "201":
          description: 评论已创建
        "403":
          description: 评论功能已关闭
  /v1/plugins/{id}/reindex:
    post:
      tags: [Plugins]
      summary: 重建索引（占位）
      description: 当前返回 ok 占位。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: ok
  /v1/comments/{id}/like:
    post:
      tags: [Plugins]
      summary: 点赞评论
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: 已点赞
  /v1/comments/{id}/unlike:
    post:
      tags: [Plugins]
      summary: 取消点赞评论
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: 已取消点赞
  /v1/comments/{id}:
    delete:
      tags: [Plugins]
      summary: 删除评论
      description: 评论作者或 admin；软删除，删除根评论隐藏回复。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: 评论已删除
        "403":
          description: 非作者且非 admin
  /v1/auth/internal/login:
    post:
      tags: [Auth]
      summary: 内部账号登录
      description: 用户名 + 密码（核心管理员与内部用户）。
      responses:
        "200":
          description: 登录成功，设置 session cookie
        "401":
          description: 凭证无效
        "403":
          description: 公开登录已关闭
  /v1/auth/github/login:
    get:
      tags: [Auth]
      summary: 跳转 GitHub OAuth
      description: 需 GITHUB_LOGIN_ENABLED=true。
      responses:
        "302":
          description: 重定向到 GitHub 授权页
        "501":
          description: OAuth 未配置
  /v1/auth/github/callback:
    get:
      tags: [Auth]
      summary: GitHub OAuth 回调
      description: 交换 token、创建/关联用户、建立 session；GITHUB_ADMIN_ORG 成员自动提权。
      responses:
        "302":
          description: 回调成功，重定向回站点
        "400":
          description: OAuth state 无效或缺少 code
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: 注销
      description: 清除 cookie 与 Redis session。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 已注销
  /v1/auth/session:
    get:
      tags: [Auth]
      summary: 校验当前 session
      security:
        - cookieAuth: []
      responses:
        "200":
          description: session 有效
        "401":
          description: 未认证
  /v1/auth/debug-login:
    get:
      tags: [Auth]
      summary: 开发调试登录
      description: 仅 ENABLE_DEV_AUTH=true；通过 X-Dev-GitHub-Login 头建用户。生产必须关闭。
      responses:
        "200":
          description: 调试登录成功
        "501":
          description: 开发认证未启用
  /v1/admin/check:
    get:
      tags: [Admin]
      summary: 当前用户权限位
      description: core_admin / admin / can_* 标志。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 权限位
        "401":
          description: 未认证
  /v1/permissions:
    get:
      tags: [Admin]
      summary: 当前用户功能权限
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 功能权限
        "401":
          description: 未认证
  /v1/me:
    get:
      tags: [Me]
      summary: 当前用户信息
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前用户
        "401":
          description: 未认证
  /v1/me/profile:
    patch:
      tags: [Me]
      summary: 更新个人资料
      description: 头像、github_token、通知偏好（notify_replies/notify_likes）。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 资料已更新
        "401":
          description: 未认证
  /v1/me/plugins:
    get:
      tags: [Me]
      summary: 我的插件
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前用户拥有的插件
        "401":
          description: 未认证
  /v1/me/api-keys:
    get:
      tags: [API Keys]
      summary: 个人 API Key 列表
      description: 仅返回名称、scopes、创建时间，不含明文。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 个人 Key 元数据列表
        "401":
          description: 未认证
    post:
      tags: [API Keys]
      summary: 创建个人 API Key
      description: "sk-ah- 前缀，原文仅本次返回。"
      security:
        - cookieAuth: []
      responses:
        "201":
          description: 个人 Key 已颁发（明文仅返回一次）
        "401":
          description: 未认证
  /v1/me/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: 删除个人 API Key
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "200":
          description: 已删除
        "401":
          description: 未认证
  /v1/me/notifications:
    get:
      tags: [Me]
      summary: 我的通知列表（分页）
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 通知列表
        "401":
          description: 未认证
    delete:
      tags: [Me]
      summary: 清空全部通知
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 已清空
        "401":
          description: 未认证
  /v1/me/notifications/unread-count:
    get:
      tags: [Me]
      summary: 未读通知数
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 未读计数
        "401":
          description: 未认证
  /v1/me/notifications/read:
    post:
      tags: [Me]
      summary: 全部标记已读
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 已标记
        "401":
          description: 未认证
  /v1/me/notifications/delete:
    post:
      tags: [Me]
      summary: 批量删除通知
      description: 按 id 列表批量删除（仅限当前用户的通知）。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 已删除
        "401":
          description: 未认证
  /v1/me/notifications/{id}:
    delete:
      tags: [Me]
      summary: 删除单条通知
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: 已删除
        "401":
          description: 未认证
  /v1/admin/summary:
    get:
      tags: [Admin]
      summary: 管理后台统计摘要
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 统计摘要
        "403":
          description: 需要 admin
  /v1/admin/plugins:
    get:
      tags: [Admin]
      summary: 全部插件（含 unlisted）
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 插件列表
        "403":
          description: 需要 admin
  /v1/admin/plugins/{id}/list:
    post:
      tags: [Admin]
      summary: 审核通过上架
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: 已上架
        "403":
          description: 需要 admin
  /v1/admin/plugins/{id}/unlist:
    post:
      tags: [Admin]
      summary: 管理员下架插件
      description: 需填写 reason，并通知所有者。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: 已下架并通知所有者
        "403":
          description: 需要 admin
  /v1/admin/plugins/{id}/refresh-github:
    post:
      tags: [Admin]
      summary: 异步刷新 GitHub 元数据
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "202":
          description: 已加入异步刷新队列
        "403":
          description: 需要 admin
  /v1/admin/comments/{id}:
    delete:
      tags: [Admin]
      summary: 管理员删除评论
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: 评论已删除
        "403":
          description: 需要 admin
  /v1/admin/users:
    get:
      tags: [Admin]
      summary: 用户列表
      description: 列表对 github_token 等敏感字段脱敏。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 用户列表
        "403":
          description: 需要 admin
  /v1/admin/users/{id}/mute:
    post:
      tags: [Admin]
      summary: 禁言用户
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 已禁言
        "403":
          description: 需要 admin
  /v1/admin/users/{id}/unmute:
    post:
      tags: [Admin]
      summary: 解除禁言
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 已解禁
        "403":
          description: 需要 admin
  /v1/admin/settings:
    get:
      tags: [Core]
      summary: 读取系统设置（脱敏）
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 系统设置（敏感字段遮蔽）
        "403":
          description: 需要 core_admin
    put:
      tags: [Core]
      summary: 更新系统设置
      description: "热更新站点/OAuth/市场策略/邮件；遮蔽值保留已有密钥。"
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 设置已保存并热更新
        "403":
          description: 需要 core_admin
  /v1/admin/settings/email/test:
    post:
      tags: [Core]
      summary: 发送测试邮件
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 测试邮件已发送
        "400":
          description: 邮件未配置或发送失败
        "403":
          description: 需要 core_admin
  /v1/admin/setup/status:
    get:
      tags: [Core]
      summary: setup 状态（管理员，含已保存脱敏配置）
      security:
        - cookieAuth: []
      responses:
        "200":
          description: setup 状态
        "403":
          description: 需要 core_admin
  /v1/core/users:
    post:
      tags: [Core]
      summary: 创建内部用户
      security:
        - cookieAuth: []
      responses:
        "201":
          description: 内部用户已创建
        "403":
          description: 需要 core_admin
  /v1/core/users/{id}:
    delete:
      tags: [Core]
      summary: 删除内部用户
      description: 不删除 core_admin；不连带删除其插件。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 已删除
        "403":
          description: 需要 core_admin
  /v1/core/admins/{id}:
    post:
      tags: [Core]
      summary: 修改用户角色
      description: admin ↔ user 切换。
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 角色已更新
        "403":
          description: 需要 core_admin
  /v1/core/announcements:
    post:
      tags: [Core]
      summary: 发布公告
      security:
        - cookieAuth: []
      responses:
        "201":
          description: 公告已创建
        "403":
          description: 需要 core_admin
  /v1/api-keys:
    post:
      tags: [API Keys]
      summary: 颁发全局 API Key
      description: "sk-ah- 前缀，admin 操作；原文仅本次返回。"
      security:
        - cookieAuth: []
      responses:
        "201":
          description: 全局 Key 已颁发
        "403":
          description: 需要 admin
    get:
      tags: [API Keys]
      summary: 列出全局 API Key 元数据
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Key 元数据列表
        "401":
          description: 缺失或无效 API Key
  /plugins.json:
    get:
      tags: [AstrBot Source]
      summary: AstrBot 插件源 feed
      description: 以插件名为键，兼容 AstrBot 自定义仓库格式。
      responses:
        "200":
          description: 插件源 JSON
  /plugins-md5.json:
    get:
      tags: [AstrBot Source]
      summary: 插件源 MD5 摘要
      description: 供 AstrBot 源缓存校验。
      responses:
        "200":
          description: MD5 摘要
  /v1/astrbot/plugins:
    get:
      tags: [AstrBot Source]
      summary: 插件源 feed（v1 前缀别名）
      responses:
        "200":
          description: 插件源 JSON
  /v1/astrbot/plugins.json:
    get:
      tags: [AstrBot Source]
      summary: 插件源 feed（v1 前缀）
      responses:
        "200":
          description: 插件源 JSON
  /v1/astrbot/plugins-md5.json:
    get:
      tags: [AstrBot Source]
      summary: 插件源 MD5 摘要（v1 前缀）
      responses:
        "200":
          description: MD5 摘要
  /v1/plugins/registrations:
    post:
      tags: [Artifacts]
      summary: 登记稳定插件身份
      security: [{cookieAuth: []}]
      responses:
        "200": {description: 已登记或返回现有插件}
        "403": {description: 仓库/插件所有权不匹配}
        "503": {description: artifact 功能未就绪}
  /v1/plugins/{id}/artifacts/upload:
    post:
      tags: [Artifacts]
      summary: 流式上传 ZIP artifact；可关联要求修改的 supersedes artifact
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/PluginId"}]
      responses:
        "202": {description: 已隔离并创建预检任务}
        "429": {description: 用户或来源 IP 超过 artifact 提交频率限制}
        "413": {description: 上传超过限制}
  /v1/plugins/{id}/artifacts/github:
    post:
      tags: [Artifacts]
      summary: 固定公开 GitHub ref 到 commit 并创建 artifact；可关联 supersedes artifact
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/PluginId"}]
      responses:
        "202": {description: 已固定 commit、隔离并创建预检任务}
        "429": {description: 用户或来源 IP 超过 artifact 提交频率限制}
  /v1/me/artifacts:
    get:
      tags: [Artifacts]
      summary: 当前作者的 artifact 版本历史
      security: [{cookieAuth: []}]
      responses:
        "200": {description: Artifact 分页列表}
  /v1/artifacts/{artifact_id}:
    get:
      tags: [Artifacts]
      summary: Artifact、runs、findings 与 decisions 详情
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ArtifactId"}]
      responses:
        "200": {description: 结构化审查详情（不含完整源码）}
        "403": {description: 非作者且非管理员}
  /v1/artifacts/{artifact_id}/runs:
    get:
      tags: [Artifacts]
      summary: 自动审查运行记录
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ArtifactId"}]
      responses:
        "200": {description: Review runs}
  /v1/artifacts/{artifact_id}/findings:
    get:
      tags: [Artifacts]
      summary: 结构化 findings
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ArtifactId"}]
      responses:
        "200": {description: Findings（仅有限 evidence excerpt）}
  /v1/artifacts/{artifact_id}/files:
    get:
      tags: [Artifacts]
      summary: 分页列出已登记 Artifact 文件树
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {in: query, name: limit, schema: {type: integer, default: 200}}
        - {in: query, name: offset, schema: {type: integer, default: 0}}
      responses:
        "200": {description: 文件 metadata；不含 content key 或私有对象 URL}
        "403": {description: 非作者且非管理员}
  /v1/artifacts/{artifact_id}/files/{file_id}/content:
    get:
      tags: [Artifacts]
      summary: 按 1-based 行号分页读取已登记 UTF-8 文本
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {$ref: "#/components/parameters/ArtifactFileId"}
        - {in: query, name: start_line, schema: {type: integer, default: 1}}
        - {in: query, name: line_limit, schema: {type: integer, default: 200}}
      responses:
        "200": {description: SHA/tree 绑定的受限纯文本行；Cache-Control no-store}
        "415": {description: 文件不是已登记 UTF-8 文本}
        "416": {description: 行范围无效}
  /v1/artifacts/{artifact_id}/diff:
    get:
      tags: [Artifacts]
      summary: 分页列出 SHA/tree 绑定的 Artifact diff 摘要
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {in: query, name: limit, schema: {type: integer, default: 200}}
        - {in: query, name: offset, schema: {type: integer, default: 0}}
      responses:
        "200": {description: Diff metadata；不含 hunks key}
  /v1/artifacts/{artifact_id}/diff/{diff_id}:
    get:
      tags: [Artifacts]
      summary: 读取已登记、校验后的受限 diff hunks
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {$ref: "#/components/parameters/ArtifactDiffId"}
        - {in: query, name: hunk_id, schema: {type: string}}
      responses:
        "200": {description: 结构化纯文本 hunks；Cache-Control no-store}
        "409": {description: Diff object、file SHA 或两端 tree 已漂移}
  /v1/artifacts/{artifact_id}/comments:
    get:
      tags: [Artifacts]
      summary: 分页查看行级审查线程和追加事件
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {in: query, name: limit, schema: {type: integer, default: 20}}
        - {in: query, name: offset, schema: {type: integer, default: 0}}
      responses:
        "200": {description: 纯文本评论投影；不含用户 ID、幂等键或私有对象 key；Cache-Control no-store}
        "403": {description: 非作者且非管理员}
  /v1/artifacts/{artifact_id}/comments/{thread_id}/replies:
    post:
      tags: [Artifacts]
      summary: 作者或管理员以 optimistic version 回复线程
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {$ref: "#/components/parameters/ReviewThreadId"}
      responses:
        "200": {description: 已追加 reply event}
        "409": {description: 版本冲突或线程已被最终决定锁定}
  /v1/artifacts/{artifact_id}/comments/{thread_id}/author-addressed:
    post:
      tags: [Artifacts]
      summary: 作者标记审查意见已处理；不等同于管理员 resolve
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {$ref: "#/components/parameters/ReviewThreadId"}
      responses:
        "200": {description: 已追加 author_addressed event}
        "403": {description: 只有 artifact 作者可执行}
  /v1/admin/artifacts:
    get:
      tags: [Reviews]
      summary: 管理员 artifact 审查队列
      security: [{cookieAuth: []}]
      responses:
        "200": {description: 可按状态与风险筛选的分页队列}
        "403": {description: 需要管理员权限}
  /v1/admin/artifacts/{artifact_id}/comments:
    post:
      tags: [Reviews]
      summary: 在已登记 current/base 文本或 diff hunk 行上创建审查线程
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ArtifactId"}]
      responses:
        "201": {description: 已创建 SHA/line 绑定线程和 create event}
        "400": {description: 正文、文件、side、行范围或 source thread 无效}
        "409": {description: Artifact 已作最终决定或内容绑定已漂移}
  /v1/admin/artifacts/{artifact_id}/comments/{thread_id}/edit:
    post:
      tags: [Reviews]
      summary: 管理员编辑自己创建且未锁定的根评论
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {$ref: "#/components/parameters/ReviewThreadId"}
      responses:
        "200": {description: 已追加 edit event 并更新线程投影}
        "403": {description: 不能编辑其他管理员或作者的内容}
  /v1/admin/artifacts/{artifact_id}/comments/{thread_id}/resolve:
    post:
      tags: [Reviews]
      summary: 管理员解决审查线程
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {$ref: "#/components/parameters/ReviewThreadId"}
      responses:
        "200": {description: 已追加 resolve event}
        "409": {description: optimistic version 冲突或线程已锁定}
  /v1/admin/artifacts/{artifact_id}/comments/{thread_id}/reopen:
    post:
      tags: [Reviews]
      summary: 管理员重开审查线程
      security: [{cookieAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ArtifactId"}
        - {$ref: "#/components/parameters/ReviewThreadId"}
      responses:
        "200": {description: 已追加 reopen event}
        "409": {description: optimistic version 冲突或线程已锁定}
  /v1/admin/artifacts/{artifact_id}/approve:
    post:
      tags: [Reviews]
      summary: 人工批准并原子创建发布任务
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ArtifactId"}]
      responses:
        "200": {description: 已批准并排队发布}
        "409": {description: 状态、强制 runs 或 repo_version 已变化}
  /v1/admin/artifacts/{artifact_id}/reject:
    post:
      tags: [Reviews]
      summary: 人工拒绝 artifact
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ArtifactId"}]
      responses:
        "200": {description: 已拒绝，不发布 CDN URL}
  /v1/admin/artifacts/{artifact_id}/request-changes:
    post:
      tags: [Reviews]
      summary: 要求作者修改 artifact
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ArtifactId"}]
      responses:
        "200": {description: 已锁定审查结果并标记为需要修改，不发布 CDN URL}
        "400": {description: 必须提供修改原因}
        "409": {description: Artifact 不处于待人工审查状态}
  /v1/admin/artifacts/{artifact_id}/retry-publish:
    post:
      tags: [Reviews]
      summary: 重试已批准 artifact 的 CDN 发布
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ArtifactId"}]
      responses:
        "200": {description: 已重新排队}
  /v1/admin/plugins/{id}/revoke-release:
    post:
      tags: [Reviews]
      summary: 安全撤回当前 CDN artifact
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/PluginId"}]
      responses:
        "200": {description: 已原子记录决策、移出插件源并创建撤回任务}
components:
  parameters:
    PluginId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: 插件 ID
    CommentId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: 评论 ID
    UserId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: 用户 ID
    ApiKeyId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: API Key ID
    NotificationId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: 通知 ID
    ArtifactId:
      in: path
      name: artifact_id
      required: true
      schema:
        type: string
      description: 不可变插件包 Artifact ID
    ArtifactFileId:
      in: path
      name: file_id
      required: true
      schema:
        type: string
      description: 必须属于路径中 Artifact 的已登记文件 ID
    ArtifactDiffId:
      in: path
      name: diff_id
      required: true
      schema:
        type: string
      description: 必须属于路径中 Artifact 的已登记 Diff ID
    ReviewThreadId:
      in: path
      name: thread_id
      required: true
      schema:
        type: string
      description: 必须属于路径中 Artifact 的审查线程 ID
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: astrbot_market_session
      description: 登录会话 cookie（内部账号或 GitHub OAuth 建立）。
    bearerAuth:
      type: http
      scheme: bearer
      description: "API Key（sk-ah- 前缀或 MARKET_API_KEYS 静态 Key），通过 Authorization: Bearer <key> 发送。"
