services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-}
        VITE_BASE_URL: ""
    image: astrbot-community-plugins:local-personal
    user: "${API_UID_GID:-10001:10001}"
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8787}:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      MARKET_STORAGE_MODE: local
      LOCAL_DATA_PATH: /var/lib/astrbot-market/data/market-state.json
      APP_ENV_FILE: /var/lib/astrbot-market/data/.env
      WEB_URL: ${WEB_URL:-http://127.0.0.1:8787}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:8787}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_DEV_AUTH: ${ENABLE_DEV_AUTH:-false}
      ARTIFACTS_ENABLED: "false"
      PLUGIN_AUTO_APPROVE_ENABLED: ${PLUGIN_AUTO_APPROVE_ENABLED:-true}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      CORE_ADMIN_USERNAME: ${CORE_ADMIN_USERNAME:-}
      CORE_ADMIN_PASSWORD: ${CORE_ADMIN_PASSWORD:-}
      CORE_ADMIN_PASSWORD_HASH: ${CORE_ADMIN_PASSWORD_HASH:-}
    volumes:
      - market-local-data:/var/lib/astrbot-market/data

volumes:
  market-local-data:
